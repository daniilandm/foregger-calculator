name: Update Prices and Deploy

on:
  schedule:
    - cron: "0 12 * * *"   # Every day at 8am ET
  workflow_dispatch:         # Manual trigger from Actions tab
  push:
    branches: ["main"]       # Also deploy whenever you commit anything

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0            # get full history so pulls/rebases work
        persist-credentials: true # ensure GITHUB_TOKEN is available for git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape AAA diesel prices
        run: node scrape-prices.js

      - name: Commit updated prices.json
  run: |
    git config user.name  "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"

    # Ensure we're on the main branch and have latest commits
    git checkout main
    git fetch origin main
    git pull --rebase origin main

    # Stage and commit only if there are changes
    git add prices.json
    git diff --staged --quiet || git commit -m "chore: update diesel prices $(date +%Y-%m-%d)"

    # Push the new commit
    git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
