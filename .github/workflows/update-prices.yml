name: Update Diesel Prices

on:
  schedule:
    - cron: "0 12 * * *"   # Every day at 8am ET
  workflow_dispatch:         # Allows manual trigger too

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape AAA diesel prices
        run: node scrape-prices.js

      - name: Commit updated prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update diesel prices $(date +%Y-%m-%d)"
          git push
