name: Update Prices and Deploy

on:
  schedule:
    - cron: "0 12 * * *"   # Every day at 8am ET
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true   # cancel older runs to reduce push races

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # get full history so pulls/rebases work
          persist-credentials: true # ensure GITHUB_TOKEN is available for git push

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"       # update from 20 to avoid deprecation warning

      - name: Scrape AAA diesel prices
        run: node scrape-prices.js

      - name: Commit updated prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we're on main and have latest remote changes
          git checkout main
          git fetch origin main

          # Stage and commit only if there are changes
          git add prices.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update diesel prices $(date +%Y-%m-%d)"

          # Rebase our commit on top of the latest remote main to avoid non-fast-forward push.
          # If the rebase fails due to conflicts, the job will stop and you can inspect manually.
          git rebase origin/main

          # Push the rebased commit (fast-forward)
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
