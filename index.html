  .recharts-cartesian-axis-tick-value,.recharts-legend-item-text{
    fill:var(--muted)!important;color:var(--muted)!important;font-size:11px;font-family:"DM Mono",monospace

  .fade-in{opacity:0;transform:translateY(8px);animation:fi 0.4s ease forwards}
  .fade-in-x{opacity:0;transform:translateX(-6px);animation:fix 0.35s ease forwards}

// ─── Calculation core ──────────────────────────────────────────────────────
function dieselGalPerHr(len, cool, weather){ return DIESEL_GAL_PER_HR[len][cool] * (WEATHER_MULTIPLIER[weather]?.[cool] ?? 1.0); }
function trueGalPerHr(len, cool, w, braking, weather){
  // Regen capture is fixed (vehicle physics). TRUE remainder changes with weather:
  // remainder_weather = max(0, weatherBaseline - regen_capture)
  // regen_capture = diesel_cold_base - true_remainder_cold
  const coldBase = DIESEL_GAL_PER_HR[len][cool];
  const coldRemainder = TRUE_REMAINDER_GAL_PER_HR[braking][w][len][cool];
  const regenCapture = coldBase - coldRemainder;  // fixed regardless of weather
  const weatherMult = WEATHER_MULTIPLIER[weather]?.[cool] ?? 1.0;
  const weatherBaseline = coldBase * weatherMult;
  return Math.max(0, weatherBaseline - regenCapture);
}
function trueKwhPerHr(len, cool, w, braking, weather){ return trueGalPerHr(len, cool, w, braking, weather) * KWH_PER_GAL_EQUIV; }

function computeAnnualEnergy(i) {
  const dieselRate = dieselGalPerHr(i.trailerLength, i.coolingMode, i.weatherSeason);
  const trueRate   = trueGalPerHr  (i.trailerLength, i.coolingMode, i.weightScenario, i.brakingScenario, i.weatherSeason);
  const kwhRate    = trueKwhPerHr  (i.trailerLength, i.coolingMode, i.weightScenario, i.brakingScenario, i.weatherSeason);
  const pctDiesel  = 1 - i.pctTimeElectricCharging;
  const effDiesel  = trueRate * pctDiesel;
  const dieselGal  = dieselRate * i.reeferHoursPerYear;
  const trueGal    = effDiesel  * i.reeferHoursPerYear;
  const kwhDrawn   = kwhRate * i.pctTimeElectricCharging * i.reeferHoursPerYear;
  const gallonsSaved = dieselGal - trueGal;
  return {
    dieselGalPerHour: dieselRate, trueGalPerHour: trueRate, trueKwhPerHour: kwhRate,
    annualDieselGallons: dieselGal, annualTrueGallons: trueGal, annualKwhConsumed: kwhDrawn,
    gallonsSaved,
    pctFuelReduction: dieselGal > 0 ? gallonsSaved/dieselGal : 0,
  };
}

function computeAnnualFinancials(i, e) {
  const annualDieselCost = e.annualDieselGallons * i.dieselPricePerGal;
  const annualTrueCost   = e.annualTrueGallons   * i.dieselPricePerGal
                         + e.annualKwhConsumed   * i.electricityPricePerKwh;
  const annualFuelSavings = annualDieselCost - annualTrueCost;
  const totalAnnualSavings = annualFuelSavings + i.annualMaintenanceSavings;
  return {
    annualDieselCost, annualTrueFuelCost: annualTrueCost,
    annualFuelSavings, annualMaintenanceSavings: i.annualMaintenanceSavings,
    totalAnnualSavings,
    fleetAnnualDieselCost: annualDieselCost * i.fleetSize,
    fleetAnnualTrueFuelCost: annualTrueCost * i.fleetSize,
    fleetAnnualSavings: totalAnnualSavings  * i.fleetSize,
  };
}

function annualLoanPayment(principal, rate, term){
  if(principal<=0||term<=0) return 0;
  const m = term*12, r = rate/12;
  if(r===0) return principal/term;
  return (principal*r)/(1 - Math.pow(1+r, -m)) * 12;
}

function buildCashFlow(i, f) {
  const baseline = f.annualDieselCost;
  const trueOp   = f.annualTrueFuelCost - i.annualMaintenanceSavings;
  const years = [];
  let cum=0, npvCum=0;
  for(let t=0; t<=i.analysisHorizonYears; t++){
    let upfront=0, financing=0, base=0, withTrue=0;
    if(t===0){
      if(i.acquisitionMode==="cash"){
        upfront = i.systemPrice * (1 + i.salesTaxRate);
      } else if(i.acquisitionMode==="financed"){
        upfront = i.systemPrice * i.downPaymentPct + i.systemPrice * i.salesTaxRate;
      }
    } else {
      base = baseline; withTrue = trueOp;
      if(i.acquisitionMode==="financed" && t<=i.financingTermYears){
        const principal = i.systemPrice*(1-i.downPaymentPct);
        financing = annualLoanPayment(principal, i.interestRate, i.financingTermYears);
      } else if(i.acquisitionMode==="lease"){
        const annualLease = 14400*(1+i.salesTaxRate);
        financing = annualLease;  // lease runs for full horizon
      }
      if((i.acquisitionMode==="cash"||i.acquisitionMode==="financed") && t===i.financingTermYears){
        financing -= i.residualValue;
      }
    }
    const annual = base - withTrue - financing - upfront;
    cum += annual;
    const disc = t===0 ? 1 : Math.pow(1+i.discountRate, t);
    const discAnnual = annual/disc;
    npvCum += discAnnual;
    years.push({
      year:t,
      baselineFuelCost:    base    * i.fleetSize,
      trueFuelCost:        withTrue* i.fleetSize,
      trueFinancingCost:   financing*i.fleetSize,
      trueUpfrontCost:     upfront * i.fleetSize,
      annualSavings:       annual  * i.fleetSize,
      cumulativeSavings:   cum     * i.fleetSize,
      discountedAnnualSavings: discAnnual * i.fleetSize,
      npvToDate:           npvCum  * i.fleetSize,
    });
  }
  return years;
}

function computePaybackPeriod(cf){
  for(let i=1; i<cf.length; i++){
    const p=cf[i-1], c=cf[i];
    if(p.cumulativeSavings<0 && c.cumulativeSavings>=0){
      const frac = -p.cumulativeSavings/(c.cumulativeSavings - p.cumulativeSavings);
      return p.year + frac;
    }
    if(p.cumulativeSavings>=0 && i===1) return 0;
  }
  return null;
}

function computeIRR(cf){
  const flows = cf.map(y => y.annualSavings);
  if(!flows.some(f=>f>0) || !flows.some(f=>f<0)) return null;
  const npv = r => flows.reduce((s,f,t)=> s + f/Math.pow(1+r,t), 0);
  let r=0.1;
  for(let it=0; it<100; it++){
    const f=npv(r), eps=1e-5, d=(npv(r+eps)-f)/eps;
    if(Math.abs(d)<1e-10) break;
    const nx=r-f/d;
    if(Math.abs(nx-r)<1e-7) return nx;
    r=nx; if(r<-0.99) r=-0.99; if(r>10) r=10;
  }
  let lo=-0.99, hi=10;
  for(let it=0; it<200; it++){
    const mid=(lo+hi)/2, fm=npv(mid);
    if(Math.abs(fm)<1) return mid;
    if(npv(lo)*fm<0) hi=mid; else lo=mid;
  }
  return null;
}

function computeAnnualCO2Avoided(e, fleet){
  const gross = e.gallonsSaved * CO2_KG_PER_GAL_DIESEL;
  const grid  = e.annualKwhConsumed * CO2_KG_PER_KWH_GRID;
  return ((gross - grid) * fleet) / 1000;
}

function calculate(i){
  const e = computeAnnualEnergy(i);
  const f = computeAnnualFinancials(i, e);
  const cf = buildCashFlow(i, f);
  const payback = computePaybackPeriod(cf);
  const irr     = computeIRR(cf);
  const annualCo2 = computeAnnualCO2Avoided(e, i.fleetSize);
  return {
    inputs:i, energy:e, financials:f, cashflow:cf,
    paybackPeriodYears: payback,
    cumulativeSavings5yr: cf[5]?.cumulativeSavings ?? 0,
    cumulativeSavingsAtHorizon: cf[Math.min(i.analysisHorizonYears, cf.length-1)]?.cumulativeSavings ?? 0,
    npv: cf[cf.length-1].npvToDate,
    irr,
    annualCo2TonsAvoided: annualCo2,
    fleetCo2TonsAvoided10yr: annualCo2 * Math.min(10, i.analysisHorizonYears),
  };
}

function buildInputs(over={}){
  const len = over.trailerLength ?? "40ft";
  const profile = DEFAULT_OPERATING_PROFILE[len];
  const code = over.state ?? "CA";
  const s = STATE_LOOKUP[code];
  const diesel = over.dieselPricePerGal ?? (s ? s.diesel + DEF_COST_PER_GAL : 5.0 + DEF_COST_PER_GAL);
  const pctPub = over.pctPublicCharging ?? 0.10;
  const pctDep = 1 - pctPub;
  const kwh = over.electricityPricePerKwh ?? (s ? s.publicKwh*pctPub + s.depotKwh*pctDep : 0.17);
  return {
    state: code, fleetSize: over.fleetSize ?? 50,
    trailerLength: len,
    coolingMode: over.coolingMode ?? "Cool",
    weightScenario: over.weightScenario ?? "Max",
    brakingScenario: over.brakingScenario ?? "Moderate",
    weatherSeason: over.weatherSeason ?? "4 Season",
    reeferHoursPerYear: over.reeferHoursPerYear ?? profile.reeferHoursPerYear,
    milesPerYear: over.milesPerYear ?? profile.milesPerYear,
    dieselPricePerGal: diesel,
    electricityPricePerKwh: kwh,
    systemPrice: over.systemPrice ?? DEFAULT_SYSTEM_PRICE,
    pctTimeElectricCharging: over.pctTimeElectricCharging ?? 0,
    pctPublicCharging: pctPub,
    annualMaintenanceSavings: over.annualMaintenanceSavings ?? 0,
    acquisitionMode: over.acquisitionMode ?? "financed",
    financingTermYears: over.financingTermYears ?? 5,
    interestRate: over.interestRate ?? 0.05,
    salesTaxRate: over.salesTaxRate ?? 0.08,
    downPaymentPct: over.downPaymentPct ?? 0.10,
    residualValue: over.residualValue ?? DEFAULT_RESIDUAL,
    discountRate: over.discountRate ?? 0.08,
    analysisHorizonYears: over.analysisHorizonYears ?? 10,
  };
}

      </div>
    </div>
  );
}

function StatCard({ label, value, subtext, accent, delay }){
  return (
    <div className={`fade-in s${delay} relative rounded-xl p-5 overflow-hidden`} style={{background:"var(--bg-card)",border:"1px solid var(--border)"}}>
      <div className="absolute left-0 top-0 bottom-0 w-[3px]" style={{background:accent==="signal"?"var(--green)":"#3b9dff",opacity:0.8}}></div>
      <div className="text-[10px] uppercase tracking-widest text-snow-500 mb-2">{label}</div>
      <div className="mono text-snow-50 text-[24px] leading-none font-semibold tracking-tight">{value}</div>
      {subtext && <div className="text-snow-400 text-[11px] mt-2">{subtext}</div>}
    </div>
  );
}

function SummaryCards({ r }){
  const f = r.financials;
  return (
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <StatCard
        label="Annual fleet savings"
        value={fmtUSD0(f.fleetAnnualSavings)}
        subtext={`${fmtUSD0(f.totalAnnualSavings)} per trailer/yr`}
        accent="signal" delay={1}
      />
      <StatCard
        label="Payback"
        value={fmtYears(r.paybackPeriodYears)}
        subtext={r.paybackPeriodYears!=null ? "cumulative cash-flow zero-crossing" : "outside horizon"}
        accent="ice" delay={2}
      />
      <StatCard
        label={`${r.inputs.analysisHorizonYears}-yr savings`}
        value={fmtUSD0(r.cumulativeSavingsAtHorizon)}
        subtext={`${fmtUSD0(r.cashflow[Math.min(5,r.inputs.analysisHorizonYears)]?.cumulativeSavings ?? 0)} at year 5`}
        accent="signal" delay={3}
      />
      <StatCard
        label="CO₂ avoided / yr"
        value={`${fmtNum(r.annualCo2TonsAvoided,0)} t`}
        subtext={`≈ ${fmtNum(r.annualCo2TonsAvoided/4.6,0)} cars off the road`}
        accent="ice" delay={4}
      />
    </div>
  );
}

function CashFlowChart({ r }){
  const data = r.cashflow.map(y => ({
    year:`Yr ${y.year}`,
    cum: Math.round(y.cumulativeSavings),
  }));
  return (
    <div className="rounded-xl p-5 fade-in s2" style={{background:"var(--bg-card)",border:"1px solid var(--border)"}}>
      <div className="flex items-baseline justify-between mb-3">
        <div>
          <div className="text-snow-100 text-sm font-medium">Cumulative cash flow</div>
          <div className="text-snow-500 text-[10px] uppercase tracking-widest mt-0.5">Fleet, undiscounted</div>
        </div>
        {r.paybackPeriodYears!=null && (
          <div className="text-[10px] text-blue-400 mono">Payback @ {r.paybackPeriodYears.toFixed(2)} yrs</div>
        )}
      </div>
      <div style={{ height: 260 }}>
        <ResponsiveContainer width="100%" height="100%">
          <AreaChart data={data} margin={{top:10,right:10,left:0,bottom:0}}>
            <defs>
              <linearGradient id="gSignal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#1ab050" stopOpacity={0.5}/>
                <stop offset="100%" stopColor="#1ab050" stopOpacity={0.02}/>
              </linearGradient>
            </defs>
            <CartesianGrid stroke="rgba(255,255,255,0.04)" vertical={false}/>
            <XAxis dataKey="year" stroke="rgba(255,255,255,0.2)" tickLine={false} axisLine={{stroke:"rgba(255,255,255,0.08)"}}/>
            <YAxis stroke="rgba(255,255,255,0.2)" tickLine={false} axisLine={false}
                   tickFormatter={v => "$"+(v/1000).toFixed(0)+"k"} width={55}/>
            <Tooltip
              formatter={v => fmtUSD0(v)}
              contentStyle={{background:"#111a24",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8}}
              labelStyle={{color:"#6b7d8d",fontSize:11,fontFamily:"DM Mono,monospace"}}
              itemStyle={{color:"#e8edf2",fontSize:12,fontFamily:"DM Mono,monospace"}}
            />
            <ReferenceLine y={0} stroke="rgba(255,255,255,0.08)" strokeDasharray="3 3"/>
            {r.paybackPeriodYears!=null && (
              <ReferenceLine
                x={`Yr ${Math.round(r.paybackPeriodYears)}`}
                stroke="#60b4ff" strokeDasharray="4 4"
                label={{value:"Payback", fill:"#60b4ff", fontSize:10, position:"top"}}
              />
            )}
            <Area type="monotone" dataKey="cum" stroke="#1ab050" strokeWidth={2} fill="url(#gSignal)" name="Cumulative" />
          </AreaChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function SavingsBreakdownChart({ r }){
  const f = r.financials;
  const data = [
    { name:"Without TRUE", value: Math.round(f.fleetAnnualDieselCost),       color:"rgba(245,165,36,0.85)" },
    { name:"With TRUE",    value: Math.round(f.fleetAnnualTrueFuelCost),     color:"rgba(62,182,255,0.85)" },
    { name:"Savings",      value: Math.round(f.fleetAnnualSavings),          color:"rgba(47,209,76,0.95)"  },
  ];
  return (
    <div className="rounded-xl p-5 fade-in s3" style={{background:"var(--bg-card)",border:"1px solid var(--border)"}}>
      <div className="flex items-baseline justify-between mb-3">
        <div>
          <div className="text-snow-100 text-sm font-medium">Annual fleet costs vs savings</div>
          <div className="text-snow-500 text-[10px] uppercase tracking-widest mt-0.5">Year-1 operating $</div>
        </div>
        <div className="text-[10px] text-snow-500 mono">{fmtPct(r.energy.pctFuelReduction)} fuel reduction</div>
      </div>
      <div style={{ height: 220 }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{top:20,right:10,left:0,bottom:5}}>
            <CartesianGrid stroke="rgba(255,255,255,0.04)" vertical={false}/>
            <XAxis dataKey="name" stroke="rgba(255,255,255,0.3)" tickLine={false} axisLine={{stroke:"rgba(255,255,255,0.08)"}}/>
            <YAxis stroke="rgba(255,255,255,0.2)" tickLine={false} axisLine={false}
                   tickFormatter={v=>"$"+(v/1000).toFixed(0)+"k"} width={55}/>
            <Tooltip
              cursor={{fill:"rgba(255,255,255,0.04)"}}
              formatter={v=>fmtUSD0(v)}
              contentStyle={{background:"#111a24",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8}}
              labelStyle={{color:"#6b7d8d",fontSize:11,fontFamily:"DM Mono,monospace"}}
              itemStyle={{color:"#e8edf2",fontSize:12,fontFamily:"DM Mono,monospace"}}
            />
            <Bar dataKey="value" radius={[4,4,0,0]}>
              {data.map((d,i)=> <Cell key={i} fill={d.color}/>)}
              <LabelList dataKey="value" position="top" formatter={v=>fmtUSD0(v)}
                style={{fill:"#e8edf2",fontFamily:"DM Mono,monospace",fontSize:11}}/>
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="grid grid-cols-3 gap-3 mt-3 pt-3 text-center" style={{borderTop:"1px solid rgba(255,255,255,0.06)"}}>
        <div>
          <div className="text-[10px] uppercase tracking-widest text-snow-500">Gallons saved</div>
          <div className="mono text-snow-50 text-base mt-1 font-medium">{fmtNum(r.energy.gallonsSaved * r.inputs.fleetSize,0)}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-widest text-snow-500">% fuel cut</div>
          <div className="mono text-snow-50 text-base mt-1 font-medium">{fmtPct(r.energy.pctFuelReduction,1)}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-widest text-snow-500">Gal/hr saved</div>
          <div className="mono text-snow-50 text-base mt-1 font-medium">{fmtNum(r.energy.dieselGalPerHour - r.energy.trueGalPerHour, 4)}</div>
        </div>
      </div>
    </div>
  );
}

function ResultsPanel({ r }){
  const f = r.financials;
  const items = [
    { label:"Annual savings per unit", value: fmtUSD0(f.totalAnnualSavings), helper: `${fmtPct(r.energy.pctFuelReduction,1)} fuel reduction` },
    { label:"Diesel gallons saved", value: fmtNum(r.energy.gallonsSaved * r.inputs.fleetSize * r.inputs.analysisHorizonYears, 0)+" gal", helper: `fleet, over ${r.inputs.analysisHorizonYears}-yr horizon` },
    { label:`NPV (${r.inputs.analysisHorizonYears}-yr fleet)`,   value: fmtUSD0(r.npv), helper: `@ ${fmtPct(r.inputs.discountRate,1)} discount` },
    { label:"IRR",                 value: r.irr!=null ? fmtPct(r.irr,1) : "—", helper: r.irr!=null && r.irr>r.inputs.discountRate ? "exceeds discount rate" : "" },
    { label:`${r.inputs.analysisHorizonYears}-yr CO₂ avoided`,   value: `${fmtNum(r.annualCo2TonsAvoided * r.inputs.analysisHorizonYears * r.inputs.fleetSize / r.inputs.fleetSize,0)} t`, helper: `≈ ${fmtNum(r.annualCo2TonsAvoided * r.inputs.analysisHorizonYears / 4.6,0)} cars total` },
    { label: r.inputs.acquisitionMode==="lease" ? "Annual lease cost" : "Upfront cash needed",
       value: r.inputs.acquisitionMode==="lease"
         ? fmtUSD0(14400*(1+r.inputs.salesTaxRate)*r.inputs.fleetSize)
         : r.inputs.acquisitionMode==="financed"
           ? fmtUSD0(r.inputs.systemPrice*(r.inputs.downPaymentPct+r.inputs.salesTaxRate)*r.inputs.fleetSize)
           : fmtUSD0(r.inputs.systemPrice*(1+r.inputs.salesTaxRate)*r.inputs.fleetSize),
       helper: r.inputs.acquisitionMode==="lease"
         ? `${r.inputs.fleetSize} units × $${(14400*(1+r.inputs.salesTaxRate)).toFixed(0)}/yr`
         : r.inputs.acquisitionMode==="financed"
           ? `${fmtPct(r.inputs.downPaymentPct)} down + tax · full price ${fmtUSD0(r.inputs.systemPrice*r.inputs.fleetSize)}`
           : `${r.inputs.fleetSize} × ${fmtUSD0(r.inputs.systemPrice*(1+r.inputs.salesTaxRate))} incl. tax` },
  ];
  return (
    <div className="rounded-xl p-5 fade-in s4" style={{background:"var(--bg-card)",border:"1px solid var(--border)"}}>
      <div className="flex items-baseline justify-between mb-4">
        <div className="text-snow-100 text-sm font-medium">Secondary metrics</div>
        <div className="text-snow-500 text-[10px] uppercase tracking-widest">Per fleet · year-1</div>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-5">
        {items.map((it,i)=>(
          <div key={i}>
            <div className="text-[10px] uppercase tracking-widest text-snow-500 mb-1">{it.label}</div>
            <div className="mono text-snow-50 text-lg leading-none font-semibold">{it.value}</div>
            {it.helper && <div className="text-[10px] text-snow-500 mt-1">{it.helper}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [inputs, setInputs] = useState(() => buildInputs({ state:"CA", fleetSize:50 }));
  const [pricesMeta, setPricesMeta] = useState({ date: "2026-05-19", live: false });
  const results = useMemo(() => calculate(inputs), [inputs]);

  // Fetch live prices from prices.json (updated daily by GitHub Actions)
  useEffect(() => {
    fetch("prices.json")
      .then(r => r.json())
      .then(data => {
        if (data.states && data.states.length > 40) {
          STATE_DATA.length = 0;
          data.states.forEach(s => STATE_DATA.push(s));
          STATE_LOOKUP_UPDATE(data.states);
          setPricesMeta({ date: data.date || "today", live: true });
          // Re-derive prices for currently selected state
          const s = data.states.find(x => x.code === inputs.state);
          if (s) setInputs(prev => ({
            ...prev,
            dieselPricePerGal: s.diesel + DEF_COST_PER_GAL,
            electricityPricePerKwh: s.publicKwh * (prev.pctPublicCharging ?? 0.10) + s.depotKwh * (1 - (prev.pctPublicCharging ?? 0.10)),
          }));
        }
      })
      .catch(() => {}); // silently fall back to baked-in prices
  }, []);


  // When state changes, re-derive diesel price and electricity rate from state data
  function handleStateChange(code){
    const s = STATE_LOOKUP[code];
    if(!s){ setInputs({...inputs, state:code}); return; }
    const pctPub = inputs.pctPublicCharging ?? 0.10;
    const pctDep = 1 - pctPub;
    setInputs({
      ...inputs,
      state: code,
      dieselPricePerGal: s.diesel + DEF_COST_PER_GAL,
      electricityPricePerKwh: s.publicKwh*pctPub + s.depotKwh*pctDep,
    });
  }

  // remove the boot loader once mounted
  useEffect(() => {
    const el = document.getElementById("boot");
    if(el) el.remove();
  }, []);

  return (
    <main className="relative min-h-screen">
      {/* Header */}
      <header className="border-b relative z-10" style={{background:"var(--bg-card)",borderColor:"var(--border)"}}>
        <div className="max-w-[1480px] mx-auto px-6 lg:px-8 py-4 flex items-center justify-between">
          <div className="flex items-baseline gap-4">
            <div className="text-snow-50 font-semibold tracking-tight text-base flex items-center gap-2">
              <span className="text-green-400 pulse">●</span> Foregger
            </div>
            <div className="text-snow-500 text-[10px] uppercase tracking-widest">Foregger Energy Solutions</div>
          </div>
          
        </div>
      </header>

      {/* Hero */}
      <section className="max-w-[1480px] mx-auto px-6 lg:px-8 pt-8 lg:pt-10 pb-6 relative z-10 fade-in">
        <div className="grid grid-cols-12 gap-8 items-end">
          <div className="col-span-12 lg:col-span-8">
            <div className="text-[11px] uppercase tracking-[0.25em] text-green-400 mb-3 font-medium">
              TCO Calculator · v1.0
            </div>
            <h1 className="text-[28px] lg:text-[44px] leading-[1.08] tracking-tight text-snow-50 font-semibold">
              Quantify the savings of a{" "}
              <span className="italic text-green-400">regenerative</span>{" "}
              refrigeration fleet.
            </h1>
            <p className="text-snow-400 text-sm mt-4 max-w-[600px] leading-relaxed">
              The FES system captures braking energy and powers the reefer unit directly —
              reducing diesel consumption, emissions, and operating cost across every
              U.S. state. Model your fleet's economics in real time.
            </p>
          </div>
          <div className="hidden lg:block lg:col-span-4 text-right">
            <div className="text-[10px] uppercase tracking-widest text-snow-500 mb-1">Diesel prices</div>
            <div className="text-snow-400 text-xs leading-relaxed">
              State averages from <a className="underline underline-offset-2 decoration-snow-500/30 hover:text-green-400"
                href="https://gasprices.aaa.com/state-gas-price-averages/" target="_blank" rel="noopener noreferrer">AAA</a>
              {" · "}
              {pricesMeta.live
                ? <span className="text-green-400">● Live — {pricesMeta.date}</span>
                : <span className="text-amber-400">● Snapshot — {pricesMeta.date}</span>
              }
            </div>
          </div>
        </div>
      </section>

      {/* Calculator grid */}
      <section className="max-w-[1480px] mx-auto px-6 lg:px-8 pb-20 relative z-10">
        <div className="grid grid-cols-12 gap-6">
          {/* Left: Inputs */}
          <aside className="col-span-12 lg:col-span-4 lg:sticky lg:top-6 lg:max-h-[calc(100vh-3rem)] lg:overflow-y-auto scroll fade-in-x">
            <div className="rounded-xl p-5" style={{background:"var(--bg-card)",border:"1px solid var(--border)"}}>
              <div className="flex items-baseline justify-between mb-4 pb-3" style={{borderBottom:"1px solid var(--border)"}}>
                <h2 className="text-snow-50 font-semibold text-sm">Scenario inputs</h2>
                <span className="text-[10px] uppercase tracking-widest text-snow-500 flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-green-500 pulse inline-block"></span> Live
                </span>
              </div>
              <InputPanel inputs={inputs} onChange={setInputs} onStateChange={handleStateChange} />
            </div>
          </aside>

          {/* Right: Results */}
          <div className="col-span-12 lg:col-span-8 space-y-4">
            <SummaryCards r={results}/>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <CashFlowChart r={results}/>
              <SavingsBreakdownChart r={results}/>
            </div>
            <ResultsPanel r={results}/>
            <div className="text-[10px] text-snow-500 leading-relaxed pt-2" style={{borderTop:"1px solid rgba(255,255,255,0.05)"}}>
              Calculation logic mirrors <span className="text-snow-200">FES TCO &amp; MLO Modeling.xlsx</span>{" "}
              · Compressor Simulation!C21:J24 (length×cooling) and C65:J80 (length×cooling×weight)
              · Braking: {results.inputs.brakingScenario} · Weather: {results.inputs.weatherSeason} (Regeneration Simulation sheet)
              · Payback method: linear interpolation across cumulative-cashflow zero-crossing (matches Years to Parity!V96)
            </div>
          </div>
        </div>
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
