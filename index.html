// ─── Core calculation engine (mirrors Tab 4 exactly) ────────────────────────
function dieselGalHr(trailerIdx, coolingMode, wxSeason){
  const mi=COOLING.indexOf(coolingMode);
  const base=DIESEL_STD[coolingMode].t[trailerIdx];
  const mult=(WX[wxSeason]||WX["4-Season Average"])[mi];
  return base*mult;
}

function calcRegen(trailerIdx, pctS1, pctS2, pctS3, pctU, pctM, pctX,
                   pctHills, altFt, driveHrs){
  // Regen kWh/hr for each weight class (blended across S1/S2/S3)
  const regenHr=(wt)=>
    RH.S1[wt][trailerIdx]*pctS1 +
    RH.S2[wt][trailerIdx]*pctS2 +
    RH.S3[wt][trailerIdx]*pctS3;
  // Braking regen/day = kWh/hr × driving hours
  const brakeU=regenHr("U")*driveHrs;
  const brakeM=regenHr("M")*driveHrs;
  const brakeX=regenHr("X")*driveHrs;
  // Hills regen/day (scaled from base table)
  const hillScale=(pctHills/HILLS_BASE_PCT)*(altFt/HILLS_BASE_FT);
  const hillU=HILLS_BASE.U[trailerIdx]*hillScale;
  const hillM=HILLS_BASE.M[trailerIdx]*hillScale;
  const hillX=HILLS_BASE.X[trailerIdx]*hillScale;
  // Total per weight class
  const totU=brakeU+hillU; const totM=brakeM+hillM; const totX=brakeX+hillX;
  // Fleet-weighted blend
  return totU*pctU + totM*pctM + totX*pctX;
}

function calcEconomics(ip){
  const ti=TRAILERS.indexOf(ip.trailer);
  const mi=COOLING.indexOf(ip.cooling);
  const dGal=dieselGalHr(ti, ip.cooling, ip.season);
  const eKwh=dGal*12; // kWh/hr equivalent
  const {driveHrs,staticHrs,days}=ip;

  // Daily energy demands
  const driveDemKwh=eKwh*driveHrs;
  const statDemKwh =eKwh*staticHrs;

  // Regen kWh/day (fleet avg)
  const regenDay=calcRegen(ti,ip.pctS1,ip.pctS2,ip.pctS3,
                            ip.pctU,ip.pctM,ip.pctX,
                            ip.pctHills,ip.altFt,driveHrs);

  // Coverage
  const driveCov  =Math.min(regenDay,driveDemKwh);
  const excess    =Math.max(0,regenDay-driveDemKwh);
  const driveRemKwh=Math.max(0,driveDemKwh-driveCov);
  const statFromRegen=Math.min(excess,statDemKwh);
  const statRemKwh=Math.max(0,statDemKwh-statFromRegen);

  // Daily diesel
  const baseDayGal=dGal*(driveHrs+staticHrs);
  const trDriveGal=driveRemKwh/12;
  const trStatGal =ip.shore ? 0 : statRemKwh/12;
  const trDayGal  =trDriveGal+trStatGal;
  const galSavedDay=baseDayGal-trDayGal;
  const shoreKwhDay=ip.shore ? statRemKwh : 0;

  // Annual costs
  const {diesel:dp,elec:ep}=ip;
  const baseYr=baseDayGal*days*dp;
  const trueYr=trDayGal*days*dp + shoreKwhDay*days*ep;
  const savYr =baseYr-trueYr;
  const pctRed=baseYr>0?savYr/baseYr:0;
  const pctDriveCov=driveDemKwh>0?driveCov/driveDemKwh:0;
  const avStatHrs=eKwh>0?excess/eKwh:0;
  const co2=(galSavedDay*10.21-shoreKwhDay*(EG[ip.state]||0.386))*days*ip.fleet/1000;

  return{
    dGal,eKwh,driveHrs,staticHrs,days,
    driveDemKwh,statDemKwh,regenDay,
    driveCov,excess,driveRemKwh,statFromRegen,statRemKwh,
    baseDayGal,trDayGal,galSavedDay,shoreKwhDay,
    baseYr,trueYr,savYr,pctRed,pctDriveCov,avStatHrs,
    annualCo2Tons:co2,
    fleetBaseYr:baseYr*ip.fleet,
    fleetTrueYr:trueYr*ip.fleet,
    fleetSavYr:savYr*ip.fleet,
  };
}

function pmt(P,r,n){
  if(!P||!n)return 0;
  const m=n*12,rm=r/12;
  if(!rm)return P/n;
  return(P*rm)/(1-Math.pow(1+rm,-m))*12;
}

function buildCF(ip,eco){
  const{fleet:n,sysPrice:sp,taxRate:tx,downPct:dp,interest:ir,
        loanYrs:ly,acqMode:am,residual:rv,discount:dr,
        horizon:hz,maintSav:ms}=ip;
  const savUnit=eco.savYr+ms;
  const cf=[]; let cum=0,npvCum=0;
  for(let t=0;t<=hz;t++){
    let up=0,fn=0,base=0,wt=0;
    if(t===0){
      if(am==="cash")up=-sp*(1+tx)*n;
      else if(am==="financed")up=-sp*(dp+tx)*n;
    } else {
      base=eco.baseYr*n; wt=(eco.trueYr-ms)*n;
      if(am==="financed"&&t<=ly) fn=-pmt(sp*(1-dp),ir,ly)*n;
      else if(am==="lease") fn=-14400*(1+tx)*n;
      if((am==="cash"||am==="financed")&&t===hz) fn+=rv*n;
    }
    const a=up+(base-wt)+fn; cum+=a;
    const disc=t===0?1:Math.pow(1+dr,t);
    npvCum+=a/disc;
    cf.push({year:t,a,cum,npv:npvCum,base:base*1,wt:wt*1});
  }
  return cf;
}

function payback(cf,am){
  if(am==="lease"&&(cf[1]?.cum||0)>0)return "immediate";
  for(let i=1;i<cf.length;i++){
    const p=cf[i-1],c=cf[i];
    if(p.cum<0&&c.cum>=0)return p.year+(-p.cum/(c.cum-p.cum));
    if(p.cum>=0&&i===1)return 0;
  }
  return null;
}

function irr(cf){
  const fl=cf.map(y=>y.a);
  if(!fl.some(f=>f>0)||!fl.some(f=>f<0))return null;
  const npv=r=>fl.reduce((s,f,t)=>s+f/Math.pow(1+r,t),0);
  let r=0.15;
  for(let i=0;i<80;i++){const f=npv(r),e=1e-6,d=(npv(r+e)-f)/e;if(Math.abs(d)<1e-12)break;const x=r-f/d;if(Math.abs(x-r)<1e-8)return x;r=x;if(r<-.99)r=-.99;if(r>10)r=10;}
  return r;
}

function calc(ip){
  const eco=calcEconomics(ip);
  const cf=buildCF(ip,eco);
  const pb=payback(cf,ip.acqMode);
  const ir2=irr(cf);
  const opPb=eco.savYr>0?ip.sysPrice*(1+ip.taxRate)/eco.savYr:null;
  return{ip,eco,cf,pb,ir2,opPb,
    npv:cf[cf.length-1].npv,
    cum10:cf[Math.min(ip.horizon,cf.length-1)]?.cum||0,
    cum5:cf[Math.min(5,cf.length-1)]?.cum||0};
}

function mkIp(o={}){
  const code=o.state||"CA"; const s=SL[code];
  const dp=(s?s.diesel+DEF:5.5+DEF);
  const ep=(s?s.dep*0.9+s.pub*0.1:0.15);
  return{
    state:code, fleet:o.fleet||50,
    trailer:o.trailer||"40ft", cooling:o.cooling||"Cool", season:o.season||"4-Season Average",
    driveHrs:o.driveHrs||6, staticHrs:o.staticHrs||3, days:o.days||300,
    pctS1:o.pctS1||0.20, pctS2:o.pctS2||0.30, pctS3:o.pctS3||0.50,
    pctU:o.pctU||0.20, pctM:o.pctM||0.35, pctX:o.pctX||0.45,
    pctHills:o.pctHills||0.10, altFt:o.altFt||500, shore:o.shore!==undefined?o.shore:true,
    diesel:o.diesel||dp, elec:o.elec||ep,
    sysPrice:45000, residual:12000, taxRate:0.08,
    acqMode:o.acqMode||"financed", interest:0.05, loanYrs:5, downPct:0.10,
    discount:0.08, horizon:o.horizon||10, maintSav:0,
  };
}

const f$=(n,d=0)=>isFinite(n)?n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:d}):"—";
const fn=(n,d=0)=>isFinite(n)?n.toLocaleString("en-US",{maximumFractionDigits:d,minimumFractionDigits:d}):"—";

// ─── Shared UI primitives ────────────────────────────────────────────────────
const card=(extra="")=>`rounded-xl p-5 ${extra}`;
const cardStyle={background:"var(--card)",border:"1px solid var(--border)"};
const raiseStyle={background:"var(--raise)",border:"1px solid var(--border)"};

function Lbl({children,hint}){
  return(
    <div className="flex items-baseline justify-between mb-1.5">
      <label className="text-[10px] uppercase tracking-wider text-snow-500">{children}</label>
      {hint&&<span className="text-[10px] mono text-snow-400">{hint}</span>}
    </div>
  );
}
function NI({v,onChange,pre,suf,dec=0,min,max,step}){
  return(
    <div className="relative">
      {pre&&<span className="absolute left-3 top-1/2 -translate-y-1/2 text-snow-500 text-xs pointer-events-none">{pre}</span>}
      <input type="number" value={v} className="ni"
        style={{paddingLeft:pre?28:11,paddingRight:suf?36:11}}
        min={min} max={max} step={step||dec>0?Math.pow(10,-dec):1}
        onChange={e=>{const x=parseFloat(e.target.value);if(isFinite(x))onChange(x);}}/>
      {suf&&<span className="absolute right-3 top-1/2 -translate-y-1/2 text-snow-500 text-[11px] pointer-events-none">{suf}</span>}
    </div>
  );
}
function Tog({opts,val,onC}){
  return(
    <div className="flex rounded-md p-0.5" style={raiseStyle}>
      {opts.map(o=>(
        <button key={String(o.v)} onClick={()=>onC(o.v)}
          className="flex-1 py-1.5 text-[11px] uppercase tracking-wider rounded-md transition"
          style={String(val)===String(o.v)
            ?{background:"rgba(26,171,86,.14)",color:"#2ecc71",outline:"1px solid rgba(26,171,86,.3)"}
            :{color:"var(--muted)"}}
          onMouseEnter={e=>{if(String(val)!==String(o.v))e.target.style.color="#dce6f0";}}
          onMouseLeave={e=>{if(String(val)!==String(o.v))e.target.style.color="var(--muted)";}}>
          {o.l}
        </button>
      ))}
    </div>
  );
}
function Sec({n,title,sub}){
  return(
    <div className="mt-4 mb-2.5">
      <div className="flex items-center gap-2">
        <span className="mono text-green-500 text-sm font-medium">{n}.</span>
        <span className="text-snow-100 text-sm font-medium">{title}</span>
      </div>
      {sub&&<p className="text-snow-500 text-[10px] mt-0.5 ml-5">{sub}</p>}
    </div>
  );
}
function PctBar({label,val,onC,hint}){
  return(
    <div>
      <div className="flex justify-between mb-0.5">
        <span className="text-[10px] text-snow-500 uppercase tracking-wide">{label}</span>
        <span className="text-[10px] mono text-snow-400">{fp(val)}</span>
      </div>
      <input type="range" min={0} max={1} step={0.05} value={val}
        onChange={e=>onC(parseFloat(e.target.value))}/>
      {hint&&<p className="text-[9px] text-snow-500 mt-0.5">{hint}</p>}
    </div>
  );
}
function norm3(keys,key,val,cur){
  const ot=keys.filter(k=>k!==key);
  const rem=Math.max(0,1-val);
  const tot=cur[ot[0]]+(cur[ot[1]]||0);
  if(tot<=0)return{[key]:val,[ot[0]]:rem/2,[ot[1]]:rem/2};
  const a=parseFloat((cur[ot[0]]/tot*rem).toFixed(3));
  const b=parseFloat((rem-a).toFixed(3));
  return{[key]:parseFloat(val.toFixed(3)),[ot[0]]:a,[ot[1]]:b};
}

// ─── Input panel ─────────────────────────────────────────────────────────────

          {SD.map(st=><option key={st.code} value={st.code}>{st.name}  {f3(st.diesel+DEF)}/gal</option>)}

            <button key={t} onClick={()=>set({trailer:t})}
              className="text-[11px] py-2 rounded-md mono transition"

          <option value="Cool">Cool — 35°F (produce, dairy)</option>

      </div>
      <div>
        <Lbl>Weather / Season</Lbl>
        <select className="sel" value={ip.season} onChange={e=>set({season:e.target.value})}>

        <PctBar label="Mid load" val={ip.pctM} onC={v=>set(norm3(["pctU","pctM","pctX"],"pctM",v,ip))}/>
        <PctBar label="Full / Max load" val={ip.pctX} onC={v=>set(norm3(["pctU","pctM","pctX"],"pctX",v,ip))}/>
        <div className="text-[9px] text-snow-500">Total: {fp(ip.pctU+ip.pctM+ip.pctX,0)}</div>
      </div>

      <Sec n="05" title="Driving profile" sub="% of drive time by braking type"/>
      <div className="space-y-2.5 p-3 rounded-lg" style={raiseStyle}>
        <PctBar label="S1 — Significant braking" val={ip.pctS1} onC={v=>set(norm3(["pctS1","pctS2","pctS3"],"pctS1",v,ip))} hint="Full/near stops — toll plazas, lights, exits"/>
        <PctBar label="S2 — Moderate braking" val={ip.pctS2} onC={v=>set(norm3(["pctS1","pctS2","pctS3"],"pctS2",v,ip))} hint="Merging, ramps, slowing traffic"/>
        <PctBar label="S3 — Micro braking" val={ip.pctS3} onC={v=>set(norm3(["pctS1","pctS2","pctS3"],"pctS3",v,ip))} hint="Cruise control adj., slight decel"/>

      </div>

      <Sec n="06" title="Operations & hills"/>
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">
          <div><Lbl>Drive hrs/day</Lbl><NI v={ip.driveHrs} onChange={v=>set({driveHrs:Math.max(0,Math.min(18,v))})} suf="h" dec={1}/></div>
          <div><Lbl>Static hrs/day</Lbl><NI v={ip.staticHrs} onChange={v=>set({staticHrs:Math.max(0,Math.min(12,v))})} suf="h" dec={1}/></div>
        </div>
        <div><Lbl>Operating days/yr</Lbl><NI v={ip.days} onChange={v=>set({days:Math.max(1,Math.round(v))})} suf="days"/></div>
        <PctBar label="Fleet % on hilly routes" val={ip.pctHills} onC={v=>set({pctHills:v})}/>

          <div><Lbl hint="500 ft = spreadsheet default">Daily altitude drop</Lbl>
            <NI v={ip.altFt} onChange={v=>set({altFt:Math.max(0,v)})} suf="ft/day"/>

          <Tog opts={[{v:true,l:"Yes — grid"},{v:false,l:"No — diesel"}]} val={ip.shore} onC={v=>set({shore:v})}/>
        </div>
      </div>

      <Sec n="07" title="Acquisition"/>
      <Tog opts={[{v:"cash",l:"Cash"},{v:"financed",l:"Financed"},{v:"lease",l:"Lease"}]}
        val={ip.acqMode} onC={v=>set({acqMode:v})}/>

      <div className="mt-3 pt-3" style={{borderTop:"1px solid var(--border)"}}>
        <button onClick={()=>setAdv(a=>!a)}
          className="w-full flex items-center justify-between text-[11px] uppercase tracking-wider py-1"
          style={{color:"var(--muted)"}}>
          <span>Advanced</span>
          <span style={{display:"inline-block",transform:adv?"rotate(180deg)":"none",transition:"transform .2s"}}>▾</span>
        </button>
        {adv&&(
          <div className="space-y-3 pt-2">
            <div><Lbl hint={fp(ip.interest,1)}>Interest rate</Lbl><NI v={ip.interest*100} onChange={v=>set({interest:v/100})} suf="%" dec={2}/></div>
            <div><Lbl>Loan term</Lbl><NI v={ip.loanYrs} onChange={v=>set({loanYrs:Math.max(1,Math.round(v))})} suf="yrs"/></div>
            <div><Lbl hint={fp(ip.discount,1)}>Discount rate (NPV)</Lbl><NI v={ip.discount*100} onChange={v=>set({discount:v/100})} suf="%" dec={2}/></div>
            <div><Lbl>Maintenance savings</Lbl><NI v={ip.maintSav} onChange={v=>set({maintSav:Math.max(0,v)})} pre="$" suf="/yr/unit"/></div>
            <div><Lbl>Analysis horizon</Lbl><NI v={ip.horizon} onChange={v=>set({horizon:Math.min(20,Math.max(1,Math.round(v)))})} suf="yrs"/></div>
          </div>
        )}
      </div>
    </div>
  );
}

                     ?`${fp(ip.downPct,0)} down + ${fp(ip.taxRate,0)} tax`
                     :ip.acqMode==="lease"?"annual lease":"cash + tax"},
                ].map((m,i)=>(
                  <div key={i}>
                    <div className="text-[9px] uppercase tracking-widest text-snow-500 mb-1">{m.l}</div>
                    <div className="mono text-snow-50 text-[15px] font-semibold leading-none">{m.v}</div>
                    {m.h&&<div className="text-[9px] text-snow-500 mt-1">{m.h}</div>}
                  </div>
                ))}
              </div>
            </div>

            {/* Footer note */}
            <div className="text-[9px] text-snow-500 leading-relaxed"
                 style={{borderTop:"1px solid rgba(255,255,255,.04)",paddingTop:6}}>
              v3 · Physics: Thermo King SLXi 400 CARB-validated fuel consumption, area-scaled by trailer size ·
              Regen: 15% efficiency (one rear axle) · Hills: 85% PE capture ·
              Prices: AAA state diesel + $0.105 DEF surcharge · CO₂: EPA eGRID 2022 ·
              Source: FES_Calculator_v3.xlsx
            </div>
          </div>
        </div>
      </section>
    </main>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
