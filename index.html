function calcTruck(ip){
  const{trailerLength:t,coolingMode:cm,weatherSeason:wx,pctS1,pctS2,pctS3,pctHills,altDropFt,pctU,pctM,pctX,dieselPrice:dp,elecPrice:ep,shorepower:sp}=ip;

  const ek=EK[cm][t]*wm; // kWh/hr for shore
  const dH=p.dH; const sH=p.sH; const days=p.days;
  const altScale=altDropFt/HILLS_BASE_FT;

  // Regen per day per weight class
  function rDay(wt){
    const rk=RH.S1[wt][t]*pctS1+RH.S2[wt][t]*pctS2+RH.S3[wt][t]*pctS3;
    const brak=rk*dH;
    const hill=HD[wt][t]*pctHills*altScale;
    return brak+hill;
  }
  function calcW(wt){
    const rd=rDay(wt);
    const dd=ek*dH; const sd=ek*sH; // driving & static demand kWh
    const dCov=Math.min(rd,dd); const exc=Math.max(0,rd-dd);
    const dRem=Math.max(0,dd-dCov); // still needed for driving
    const sFrR=Math.min(exc,sd); const sRem=Math.max(0,sd-sFrR);
    return{rd,dCov,exc,dRem,sFrR,sRem};
  }
  const wU=calcW("U"),wM=calcW("M"),wX=calcW("X");
  function bl(fn){return fn(wU)*pctU+fn(wM)*pctM+fn(wX)*pctX;}
  const rd=bl(w=>w.rd),dCov=bl(w=>w.dCov),exc=bl(w=>w.exc),dRem=bl(w=>w.dRem),sFrR=bl(w=>w.sFrR),sRem=bl(w=>w.sRem);
  // daily gal
  const basDay=dg*(dH+sH);
  const trDriveGal=Math.max(0,dRem/12);
  const trStatGal=sp?0:Math.max(0,sRem/12);
  const trDay=trDriveGal+trStatGal;
  const galSavedDay=basDay-trDay;
  const shKwh=sp?sRem:0;
  const basYr=basDay*days*dp;
  const trYr=trDay*days*dp+shKwh*days*ep;
  const savYr=basYr-trYr;
  const pctRed=basDay>0?galSavedDay/basDay:0;
  const rvTot=(dH+sH)>0?rd/((ek*(dH+sH))):0;

}

function pmtYr(P,r,n){if(!P||!n)return 0;const m=n*12,rm=r/12;if(!rm)return P/n;return(P*rm)/(1-Math.pow(1+rm,-m))*12;}
function buildCF(ip,T){
  const{fleetSize:n,systemPrice:sp,salesTaxRate:tx,downPaymentPct:dp,interestRate:ir,financingTermYears:fy,acquisitionMode:am,residualValue:rv,discountRate:dr,analysisHorizonYears:hy,annualMaintenanceSavings:ms}=ip;
  const cf=[]; let cum=0,nv=0;
  for(let t=0;t<=hy;t++){
    let up=0,fn=0,ba=0,wt=0;
    if(t===0){if(am==="cash")up=sp*(1+tx)*n;else if(am==="financed")up=sp*(dp+tx)*n;}
    else{ba=T.basYr*n;wt=(T.trYr-ms)*n;if(am==="financed"&&t<=fy)fn=pmtYr(sp*(1-dp),ir,fy)*n;else if(am==="lease")fn=14400*(1+tx)*n;if((am==="cash"||am==="financed")&&t===hy)fn-=rv*n;}
    const a=ba-wt-fn-up; cum+=a; nv+=a/Math.pow(1+dr,t===0?1:t);
    cf.push({year:t,a,cum,nv,ba,wt});
  }
  return cf;
}
function payback(cf,am){
  if(am==="lease"&&cf[1]?.cum>0)return"immediate";
  for(let i=1;i<cf.length;i++){const p=cf[i-1],c=cf[i];if(p.cum<0&&c.cum>=0)return p.year+(-p.cum/(c.cum-p.cum));if(p.cum>=0&&i===1)return 0;}return null;
}
function irr(cf){
  const fl=cf.map(y=>y.a);if(!fl.some(f=>f>0)||!fl.some(f=>f<0))return null;
  const nv=r=>fl.reduce((s,f,t)=>s+f/Math.pow(1+r,t),0);
  let r=0.1;for(let i=0;i<100;i++){const f=nv(r),e=1e-5,d=(nv(r+e)-f)/e;if(Math.abs(d)<1e-10)break;const x=r-f/d;if(Math.abs(x-r)<1e-7)return x;r=x;if(r<-0.99)r=-0.99;if(r>10)r=10;}
  let lo=-0.99,hi=10;for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=nv(m);if(Math.abs(fm)<1)return m;if(nv(lo)*fm<0)hi=m;else lo=m;}return null;
}
function calc(ip){
  const T=calcTruck(ip); const cf=buildCF(ip,T);
  const pb=payback(cf,ip.acquisitionMode); const ir2=irr(cf);
  const g2=EG[ip.state]??0.386;
  const co2=(T.galSavedDay*ip.fleetSize*T.days*10.21-T.shKwh*T.days*ip.fleetSize*g2)/1000;
  const op=T.savYr*ip.fleetSize>0?ip.systemPrice*(1+ip.salesTaxRate)*ip.fleetSize/(T.savYr*ip.fleetSize):null;
  return{ip,T,cf,pb,ir2,co2,op,npv:cf[cf.length-1].nv,ch:cf[Math.min(ip.analysisHorizonYears,cf.length-1)]?.cum??0,c5:cf[Math.min(5,cf.length-1)]?.cum??0};
}
function mkIp(o={}){

  return{state:c,fleetSize:o.fleetSize??50,trailerLength:t,coolingMode:o.coolingMode??"Cool",weatherSeason:o.weatherSeason??"4 Season",
    pctS1:o.pctS1??DS1[t],pctS2:o.pctS2??DS2[t],pctS3:o.pctS3??DS3[t],
    pctHills:o.pctHills??0,altDropFt:o.altDropFt??500,

function Sec({n,title,sub}){return(<div className="mb-2 mt-3"><div className="flex items-baseline gap-2"><span className="mono text-green-400 text-sm">{n}.</span><span className="text-snow-100 text-sm font-medium">{title}</span></div>{sub&&<div className="text-snow-500 text-[10px] mt-0.5 ml-5">{sub}</div>}</div>);}

function norm3(fields,field,val,cur){
  const others=fields.filter(f=>f!==field);
  const rem=Math.max(0,1-val);
  const total=cur[others[0]]+cur[others[1]];
  if(total<=0)return{[field]:val,[others[0]]:rem/2,[others[1]]:rem/2};
  const a=parseFloat((cur[others[0]]/total*rem).toFixed(3));
  const b=parseFloat((rem-a).toFixed(3));
  return{[field]:parseFloat(val.toFixed(3)),[others[0]]:a,[others[1]]:b};
}

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-x-5 gap-y-4">
              {[
                {l:"Savings per truck/day",v:`${f0(T.savYr/T.days)}`,h:`${f0(sYr)} fleet/yr over ${T.days} operating days`},
                {l:"Daily energy balance",v:`${fn(T.rd,2)} vs ${fn(T.dH*T.ek+T.sH*T.ek,2)} kWh`,h:`regen vs total cooling demand/day`},
                {l:"Static hrs from regen",v:`${fn(T.avSH,1)} hrs/day`,h:"excess regen covers idle cooling"},
                {l:"Regen vs driving demand",v:fp(Math.min(1,T.rvDrv)),h:`${fn(T.rd,1)} kWh regen vs ${fn(T.dH*T.ek,1)} kWh needed/day`},
                {l:`NPV (${ip.analysisHorizonYears}-yr fleet)`,v:f0(R.npv),h:`@ ${fp(ip.discountRate,1)} discount rate`},
                {l:"IRR",v:R.ir2!=null?fp(R.ir2,1):"—",h:R.ir2!=null&&R.ir2>ip.discountRate?"exceeds hurdle rate":R.ir2!=null?"below hurdle rate":""},
                {l:`${ip.analysisHorizonYears}-yr CO\u2082 avoided`,v:`${fn(R.co2*ip.analysisHorizonYears,0)} t`,h:`Grid: ${(EG[ip.state]??0.386).toFixed(3)} kg/kWh (${ip.state} eGRID)`},
                {l:ip.acquisitionMode==="lease"?"Annual lease cost":"Upfront cash needed",
                 v:ip.acquisitionMode==="lease"?f0(14400*(1+ip.salesTaxRate)*n):ip.acquisitionMode==="financed"?f0(ip.systemPrice*(ip.downPaymentPct+ip.salesTaxRate)*n):f0(ip.systemPrice*(1+ip.salesTaxRate)*n),
                 h:ip.acquisitionMode==="financed"?`${fp(ip.downPaymentPct,0)} down + tax`:""},
              ].map((x,i)=>(
                <div key={i}>
                  <div className="text-[9px] uppercase tracking-widest text-snow-500 mb-1">{x.l}</div>
                  <div className="mono text-snow-50 text-base font-semibold leading-none">{x.v}</div>
                  {x.h&&<div className="text-[10px] text-snow-500 mt-1">{x.h}</div>}
                </div>
              ))}
            </div>
          </div>

          <div className="text-[9px] text-snow-500 leading-relaxed" style={{borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:"6px"}}>
            v2 based on DaniilCopyRegenCalc.xlsx Customer Economics tab  Cooling demand from Required Energy tab (parked-trailer estimate)  Regen efficiency 15%  Hills 85% capture  EPA eGRID 2022 CO2  AAA diesel {pm.date}  Note: cooling demand baseline may be conservative vs active-driving TRU specs
          </div>
        </div>
      </div>
    </section>
  </main>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
