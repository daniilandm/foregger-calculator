// ─── Calculation core ──────────────────────────────────────────────────────
function dieselGalPerHr(len, cool){ return DIESEL_GAL_PER_HR[len][cool]; }
function trueGalPerHr(len, cool, w, braking){ return Math.max(0, TRUE_REMAINDER_GAL_PER_HR[braking][w][len][cool]); }
function trueKwhPerHr(len, cool, w, braking){ return trueGalPerHr(len, cool, w, braking) * KWH_PER_GAL_EQUIV; }

function computeAnnualEnergy(i) {
  const dieselRate = dieselGalPerHr(i.trailerLength, i.coolingMode);
  const trueRate   = trueGalPerHr  (i.trailerLength, i.coolingMode, i.weightScenario, i.brakingScenario);
  const kwhRate    = trueKwhPerHr  (i.trailerLength, i.coolingMode, i.weightScenario, i.brakingScenario);
  const pctDiesel  = 1 - i.pctTimeElectricCharging;
  const effDiesel  = trueRate * pctDiesel;
  const dieselGal  = dieselRate * i.reeferHoursPerYear;
  const trueGal    = effDiesel  * i.reeferHoursPerYear;
  const kwhDrawn   = kwhRate * i.pctTimeElectricCharging * i.reeferHoursPerYear;
  const gallonsSaved = dieselGal - trueGal;
  return {
    dieselGalPerHour: dieselRate, trueGalPerHour: trueRate, trueKwhPerHour: kwhRate,
    annualDieselGallons: dieselGal, annualTrueGallons: trueGal, annualKwhConsumed: kwhDrawn,
    gallonsSaved,
    pctFuelReduction: dieselGal > 0 ? gallonsSaved/dieselGal : 0,
  };
}

function computeAnnualFinancials(i, e) {
  const annualDieselCost = e.annualDieselGallons * i.dieselPricePerGal;
  const annualTrueCost   = e.annualTrueGallons   * i.dieselPricePerGal
                         + e.annualKwhConsumed   * i.electricityPricePerKwh;
  const annualFuelSavings = annualDieselCost - annualTrueCost;
  const totalAnnualSavings = annualFuelSavings + i.annualMaintenanceSavings;
  return {
    annualDieselCost, annualTrueFuelCost: annualTrueCost,
    annualFuelSavings, annualMaintenanceSavings: i.annualMaintenanceSavings,
    totalAnnualSavings,
    fleetAnnualDieselCost: annualDieselCost * i.fleetSize,
    fleetAnnualTrueFuelCost: annualTrueCost * i.fleetSize,
    fleetAnnualSavings: totalAnnualSavings  * i.fleetSize,
  };
}

function annualLoanPayment(principal, rate, term){
  if(principal<=0||term<=0) return 0;
  const m = term*12, r = rate/12;
  if(r===0) return principal/term;
  return (principal*r)/(1 - Math.pow(1+r, -m)) * 12;
}

function buildCashFlow(i, f) {
  const baseline = f.annualDieselCost;
  const trueOp   = f.annualTrueFuelCost - i.annualMaintenanceSavings;
  const years = [];
  let cum=0, npvCum=0;
  for(let t=0; t<=i.analysisHorizonYears; t++){
    let upfront=0, financing=0, base=0, withTrue=0;
    if(t===0){
      if(i.acquisitionMode==="cash"){
        upfront = i.systemPrice * (1 + i.salesTaxRate);
      } else if(i.acquisitionMode==="financed"){
        upfront = i.systemPrice * i.downPaymentPct + i.systemPrice * i.salesTaxRate;
      }
    } else {
      base = baseline; withTrue = trueOp;
      if(i.acquisitionMode==="financed" && t<=i.financingTermYears){
        const principal = i.systemPrice*(1-i.downPaymentPct);
        financing = annualLoanPayment(principal, i.interestRate, i.financingTermYears);
      } else if(i.acquisitionMode==="lease"){
        const annualLease = 14400*(1+i.salesTaxRate);
        if(t<=i.financingTermYears) financing = annualLease;
      }
      if((i.acquisitionMode==="cash"||i.acquisitionMode==="financed") && t===i.financingTermYears){
        financing -= i.residualValue;
      }
    }
    const annual = base - withTrue - financing - upfront;
    cum += annual;
    const disc = t===0 ? 1 : Math.pow(1+i.discountRate, t);
    const discAnnual = annual/disc;
    npvCum += discAnnual;
    years.push({
      year:t,
      baselineFuelCost:    base    * i.fleetSize,
      trueFuelCost:        withTrue* i.fleetSize,
      trueFinancingCost:   financing*i.fleetSize,
      trueUpfrontCost:     upfront * i.fleetSize,
      annualSavings:       annual  * i.fleetSize,
      cumulativeSavings:   cum     * i.fleetSize,
      discountedAnnualSavings: discAnnual * i.fleetSize,
      npvToDate:           npvCum  * i.fleetSize,
    });
  }
  return years;
}

function computePaybackPeriod(cf){
  for(let i=1; i<cf.length; i++){
    const p=cf[i-1], c=cf[i];
    if(p.cumulativeSavings<0 && c.cumulativeSavings>=0){
      const frac = -p.cumulativeSavings/(c.cumulativeSavings - p.cumulativeSavings);
      return p.year + frac;
    }
    if(p.cumulativeSavings>=0 && i===1) return 0;
  }
  return null;
}

function computeIRR(cf){
  const flows = cf.map(y => y.annualSavings);
  if(!flows.some(f=>f>0) || !flows.some(f=>f<0)) return null;
  const npv = r => flows.reduce((s,f,t)=> s + f/Math.pow(1+r,t), 0);
  let r=0.1;
  for(let it=0; it<100; it++){
    const f=npv(r), eps=1e-5, d=(npv(r+eps)-f)/eps;
    if(Math.abs(d)<1e-10) break;
    const nx=r-f/d;
    if(Math.abs(nx-r)<1e-7) return nx;
    r=nx; if(r<-0.99) r=-0.99; if(r>10) r=10;
  }
  let lo=-0.99, hi=10;
  for(let it=0; it<200; it++){
    const mid=(lo+hi)/2, fm=npv(mid);
    if(Math.abs(fm)<1) return mid;
    if(npv(lo)*fm<0) hi=mid; else lo=mid;
  }
  return null;
}

function computeAnnualCO2Avoided(e, fleet){
  const gross = e.gallonsSaved * CO2_KG_PER_GAL_DIESEL;
  const grid  = e.annualKwhConsumed * CO2_KG_PER_KWH_GRID;
  return ((gross - grid) * fleet) / 1000;
}

function calculate(i){
  const e = computeAnnualEnergy(i);
  const f = computeAnnualFinancials(i, e);
  const cf = buildCashFlow(i, f);
  const payback = computePaybackPeriod(cf);
  const irr     = computeIRR(cf);
  const annualCo2 = computeAnnualCO2Avoided(e, i.fleetSize);
  return {
    inputs:i, energy:e, financials:f, cashflow:cf,
    paybackPeriodYears: payback,
    cumulativeSavings5yr: cf[5]?.cumulativeSavings ?? 0,
    cumulativeSavingsAtHorizon: cf[Math.min(i.analysisHorizonYears, cf.length-1)]?.cumulativeSavings ?? 0,
    npv: cf[cf.length-1].npvToDate,
    irr,
    annualCo2TonsAvoided: annualCo2,
    fleetCo2TonsAvoided10yr: annualCo2 * Math.min(10, i.analysisHorizonYears),
  };
}

function buildInputs(over={}){
  const len = over.trailerLength ?? "40ft";
  const profile = DEFAULT_OPERATING_PROFILE[len];
  const code = over.state ?? "CA";
  const s = STATE_LOOKUP[code];
  const diesel = over.dieselPricePerGal ?? (s ? s.diesel + DEF_COST_PER_GAL : 5.0 + DEF_COST_PER_GAL);
  const pctPub = over.pctPublicCharging ?? 0.10;
  const pctDep = 1 - pctPub;
  const kwh = over.electricityPricePerKwh ?? (s ? s.publicKwh*pctPub + s.depotKwh*pctDep : 0.17);
  return {
    state: code, fleetSize: over.fleetSize ?? 50,
    trailerLength: len,
    coolingMode: over.coolingMode ?? "Cool",
    weightScenario: over.weightScenario ?? "Max",
    brakingScenario: over.brakingScenario ?? "Moderate",
    reeferHoursPerYear: over.reeferHoursPerYear ?? profile.reeferHoursPerYear,
    milesPerYear: over.milesPerYear ?? profile.milesPerYear,
    dieselPricePerGal: diesel,
    electricityPricePerKwh: kwh,
    systemPrice: over.systemPrice ?? DEFAULT_SYSTEM_PRICE,
    pctTimeElectricCharging: over.pctTimeElectricCharging ?? 0,
    pctPublicCharging: pctPub,
    annualMaintenanceSavings: over.annualMaintenanceSavings ?? 0,
    acquisitionMode: over.acquisitionMode ?? "financed",
    financingTermYears: over.financingTermYears ?? 5,
    interestRate: over.interestRate ?? 0.05,
    salesTaxRate: over.salesTaxRate ?? 0.08,
    downPaymentPct: over.downPaymentPct ?? 0.10,
    residualValue: over.residualValue ?? DEFAULT_RESIDUAL,
    discountRate: over.discountRate ?? 0.08,
    analysisHorizonYears: over.analysisHorizonYears ?? 10,
  };
}

        label={`${r.inputs.analysisHorizonYears}-yr savings`}
        value={fmtUSD0(r.cumulativeSavingsAtHorizon)}
        subtext={`${fmtUSD0(r.cashflow[Math.min(5,r.inputs.analysisHorizonYears)]?.cumulativeSavings ?? 0)} at year 5`}
        accent="signal" delay={3}
      />
      <StatCard
        label="CO₂ avoided / yr"
        value={`${fmtNum(r.annualCo2TonsAvoided,0)} t`}
        subtext={`≈ ${fmtNum(r.annualCo2TonsAvoided/4.6,0)} cars off the road`}
        accent="ice" delay={4}
      />
    </div>
  );
}

function CashFlowChart({ r }){
  const data = r.cashflow.map(y => ({
    year:`Yr ${y.year}`,
    cum: Math.round(y.cumulativeSavings),
  }));
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-5 fade-in stagger-2 shadow-sm">
      <div className="flex items-baseline justify-between mb-3">
        <div>
          <div className="text-gray-900 text-sm font-semibold">Cumulative cash flow</div>
          <div className="text-gray-400 text-[10px] uppercase tracking-widest mt-0.5">Fleet, undiscounted</div>
        </div>
        {r.paybackPeriodYears!=null && (
          <div className="text-[10px] text-ice-400 tabular">Payback @ {r.paybackPeriodYears.toFixed(2)} yrs</div>
        )}
      </div>
      <div style={{ height: 260 }}>
        <ResponsiveContainer width="100%" height="100%">
          <AreaChart data={data} margin={{top:10,right:10,left:0,bottom:0}}>
            <defs>
              <linearGradient id="gSignal" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#1a6b3a" stopOpacity={0.4}/>
                <stop offset="100%" stopColor="#1a6b3a" stopOpacity={0.02}/>
              </linearGradient>
            </defs>
            <CartesianGrid stroke="#f1f3f5" vertical={false}/>
            <XAxis dataKey="year" stroke="#adb5bd" tickLine={false} axisLine={{stroke:"rgba(255,255,255,0.08)"}}/>
            <YAxis stroke="#adb5bd" tickLine={false} axisLine={false}
                   tickFormatter={v => "$"+(v/1000).toFixed(0)+"k"} width={55}/>
            <Tooltip
              formatter={v => fmtUSD0(v)}
              contentStyle={{background:"#fff",border:"1px solid #dee2e6",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,0.08)"}}
              labelStyle={{color:"#868e96", fontSize:11}}
              itemStyle={{color:"#0d1b2a", fontSize:12}}
            />
            <ReferenceLine y={0} stroke="#dee2e6" strokeDasharray="3 3"/>
            {r.paybackPeriodYears!=null && (
              <ReferenceLine
                x={`Yr ${Math.round(r.paybackPeriodYears)}`}
                stroke="#3eb6ff" strokeDasharray="4 4"
                label={{value:"Payback", fill:"#3eb6ff", fontSize:10, position:"top"}}
              />
            )}
            <Area type="monotone" dataKey="cum" stroke="#1a6b3a" strokeWidth={2} fill="url(#gSignal)" name="Cumulative" />
          </AreaChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

function SavingsBreakdownChart({ r }){
  const f = r.financials;
  const data = [
    { name:"Without TRUE", value: Math.round(f.fleetAnnualDieselCost),       color:"rgba(245,165,36,0.85)" },
    { name:"With TRUE",    value: Math.round(f.fleetAnnualTrueFuelCost),     color:"rgba(62,182,255,0.85)" },
    { name:"Savings",      value: Math.round(f.fleetAnnualSavings),          color:"rgba(47,209,76,0.95)"  },
  ];
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-5 fade-in stagger-3 shadow-sm">
      <div className="flex items-baseline justify-between mb-3">
        <div>
          <div className="text-gray-900 text-sm font-semibold">Annual fleet costs vs savings</div>
          <div className="text-gray-400 text-[10px] uppercase tracking-widest mt-0.5">Year-1 operating $</div>
        </div>
        <div className="text-[10px] text-gray-500 tabular">{fmtPct(r.energy.pctFuelReduction)} fuel reduction</div>
      </div>
      <div style={{ height: 220 }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{top:20,right:10,left:0,bottom:5}}>
            <CartesianGrid stroke="#f1f3f5" vertical={false}/>
            <XAxis dataKey="name" stroke="#868e96" tickLine={false} axisLine={{stroke:"rgba(255,255,255,0.08)"}}/>
            <YAxis stroke="#adb5bd" tickLine={false} axisLine={false}
                   tickFormatter={v=>"$"+(v/1000).toFixed(0)+"k"} width={55}/>
            <Tooltip
              cursor={{fill:"rgba(255,255,255,0.04)"}}
              formatter={v=>fmtUSD0(v)}
              contentStyle={{background:"#fff",border:"1px solid #dee2e6",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,0.08)"}}
              labelStyle={{color:"#868e96", fontSize:11}}
              itemStyle={{color:"#0d1b2a", fontSize:12}}
            />
            <Bar dataKey="value" radius={[4,4,0,0]}>
              {data.map((d,i)=> <Cell key={i} fill={d.color}/>)}
              <LabelList dataKey="value" position="top" formatter={v=>fmtUSD0(v)}
                style={{fill:"#eef3f1", fontFamily:"JetBrains Mono", fontSize:11}}/>
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      <div className="grid grid-cols-3 gap-3 mt-3 pt-3 border-t border-white/[0.04] text-center">
        <div>
          <div className="text-[10px] uppercase tracking-widest text-frost-400">Gallons saved</div>
          <div className="tabular text-frost-50 text-base mt-1">{fmtNum(r.energy.gallonsSaved * r.inputs.fleetSize,0)}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-widest text-frost-400">% fuel cut</div>
          <div className="tabular text-frost-50 text-base mt-1">{fmtPct(r.energy.pctFuelReduction,1)}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-widest text-frost-400">Gal/hr saved</div>
          <div className="tabular text-frost-50 text-base mt-1">{fmtNum(r.energy.dieselGalPerHour - r.energy.trueGalPerHour, 4)}</div>
        </div>
      </div>
    </div>
  );
}

function ResultsPanel({ r }){
  const f = r.financials;
  const items = [
    { label:"Annual savings per unit", value: fmtUSD0(f.totalAnnualSavings), helper: `${fmtPct(r.energy.pctFuelReduction,1)} fuel reduction` },
    { label:"Diesel gallons saved", value: fmtNum(r.energy.gallonsSaved * r.inputs.fleetSize * r.inputs.analysisHorizonYears, 0)+" gal", helper: `fleet, over ${r.inputs.analysisHorizonYears}-yr horizon` },
    { label:"NPV (10-yr fleet)",   value: fmtUSD0(r.npv), helper: `@ ${fmtPct(r.inputs.discountRate,1)} discount` },
    { label:"IRR",                 value: r.irr!=null ? fmtPct(r.irr,1) : "—", helper: r.irr!=null && r.irr>r.inputs.discountRate ? "exceeds discount rate" : "" },
    { label:`${r.inputs.analysisHorizonYears}-yr CO₂ avoided`,   value: `${fmtNum(r.annualCo2TonsAvoided * r.inputs.analysisHorizonYears * r.inputs.fleetSize / r.inputs.fleetSize,0)} t`, helper: `≈ ${fmtNum(r.annualCo2TonsAvoided * r.inputs.analysisHorizonYears / 4.6,0)} cars total` },
    { label:"Upfront fleet invest", value: fmtUSD0(r.inputs.systemPrice * r.inputs.fleetSize), helper: `${r.inputs.fleetSize} × ${fmtUSD0(r.inputs.systemPrice)}` },
  ];
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-5 fade-in stagger-4 shadow-sm">
      <div className="flex items-baseline justify-between mb-4">
        <div className="text-gray-900 text-sm font-semibold">Secondary metrics</div>
        <div className="text-gray-400 text-[10px] uppercase tracking-widest">Per fleet · year-1</div>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-5">
        {items.map((it,i)=>(
          <div key={i}>
            <div className="text-[10px] uppercase tracking-widest text-frost-400 mb-1">{it.label}</div>
            <div className="tabular text-gray-900 text-lg leading-none font-semibold">{it.value}</div>
            {it.helper && <div className="text-[10px] text-gray-400 mt-1">{it.helper}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function App(){
  const [inputs, setInputs] = useState(() => buildInputs({ state:"CA", fleetSize:50 }));
  const [pricesMeta, setPricesMeta] = useState({ date: "2026-05-19", live: false });
  const results = useMemo(() => calculate(inputs), [inputs]);

  // Fetch live prices from prices.json (updated daily by GitHub Actions)
  useEffect(() => {
    fetch("prices.json")
      .then(r => r.json())
      .then(data => {
        if (data.states && data.states.length > 40) {
          STATE_DATA.length = 0;
          data.states.forEach(s => STATE_DATA.push(s));
          STATE_LOOKUP_UPDATE(data.states);
          setPricesMeta({ date: data.date || "today", live: true });
          // Re-derive prices for currently selected state
          const s = data.states.find(x => x.code === inputs.state);
          if (s) setInputs(prev => ({
            ...prev,
            dieselPricePerGal: s.diesel + DEF_COST_PER_GAL,
            electricityPricePerKwh: s.publicKwh * (prev.pctPublicCharging ?? 0.10) + s.depotKwh * (1 - (prev.pctPublicCharging ?? 0.10)),
          }));
        }
      })
      .catch(() => {}); // silently fall back to baked-in prices
  }, []);


  // When state changes, re-derive diesel price and electricity rate from state data
  function handleStateChange(code){
    const s = STATE_LOOKUP[code];
    if(!s){ setInputs({...inputs, state:code}); return; }
    const pctPub = inputs.pctPublicCharging ?? 0.10;
    const pctDep = 1 - pctPub;
    setInputs({
      ...inputs,
      state: code,
      dieselPricePerGal: s.diesel + DEF_COST_PER_GAL,
      electricityPricePerKwh: s.publicKwh*pctPub + s.depotKwh*pctDep,
    });
  }

  // remove the boot loader once mounted
  useEffect(() => {
    const el = document.getElementById("boot-loader");
    if(el) el.remove();
  }, []);

  return (
    <main className="relative min-h-screen">
      {/* Header */}
      <header className="border-b border-gray-200 relative z-10 bg-white">
        <div className="max-w-[1480px] mx-auto px-6 lg:px-8 py-5 flex items-center justify-between">
          <div className="flex items-baseline gap-4">
            <div className="text-gray-900 font-bold tracking-tight text-lg flex items-center gap-2">
              <span className="text-signal-500 pulse-dot">●</span> Foregger
            </div>
            <div className="text-gray-500 text-[11px] uppercase tracking-widest">Foregger Energy Solutions</div>
          </div>
          
        </div>
      </header>

      {/* Hero */}
      <section className="max-w-[1480px] mx-auto px-6 lg:px-8 pt-8 lg:pt-10 pb-6 relative z-10 fade-in bg-white">
        <div className="grid grid-cols-12 gap-8 items-end">
          <div className="col-span-12 lg:col-span-8">
            <div className="text-[11px] uppercase tracking-[0.25em] text-signal-500 mb-3 font-semibold">
              TCO Calculator · v1.0
            </div>
            <h1 className="text-[32px] lg:text-[48px] leading-[1.05] tracking-tightest text-ink-950 font-semibold">
              Quantify the savings of a{" "}
              <span className="headline-serif text-signal-500">regenerative</span>{" "}
              refrigeration fleet.
            </h1>
            <p className="text-gray-500 text-base mt-4 max-w-[640px] leading-relaxed">
              The FES system captures braking energy and powers the reefer unit directly —
              reducing diesel consumption, emissions, and operating cost across every
              U.S. state. Model your fleet's economics in real time.
            </p>
          </div>
          <div className="hidden lg:block lg:col-span-4 text-right">
            <div className="text-[10px] uppercase tracking-widest text-frost-400 mb-1">Diesel prices</div>
            <div className="text-gray-600 text-xs leading-relaxed">
              State averages from <a className="underline decoration-frost-400/40 underline-offset-2 hover:text-signal-300"
                href="https://gasprices.aaa.com/state-gas-price-averages/" target="_blank" rel="noopener noreferrer">AAA</a>
              {" · "}
              {pricesMeta.live
                ? <span className="text-signal-400">● Live — {pricesMeta.date}</span>
                : <span className="text-amber-500">● Snapshot — {pricesMeta.date}</span>
              }
            </div>
          </div>
        </div>
      </section>

      {/* Calculator grid */}
      <section className="max-w-[1480px] mx-auto px-6 lg:px-8 pb-20 relative z-10 bg-gray-50">
        <div className="grid grid-cols-12 gap-6">
          {/* Left: Inputs */}
          <aside className="col-span-12 lg:col-span-4 lg:sticky lg:top-6 lg:max-h-[calc(100vh-3rem)] lg:overflow-y-auto input-scroll fade-in-x bg-gray-50">
            <div className="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
              <div className="flex items-baseline justify-between mb-5 pb-3 border-b border-gray-100">
                <h2 className="text-gray-900 font-semibold text-sm">Scenario inputs</h2>
                <span className="text-[10px] uppercase tracking-widest text-frost-400 flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-signal-500 pulse-dot inline-block"></span> Live calc
                </span>
              </div>
              <InputPanel inputs={inputs} onChange={setInputs} onStateChange={handleStateChange} />
            </div>
          </aside>

          {/* Right: Results */}
          <div className="col-span-12 lg:col-span-8 space-y-4">
            <SummaryCards r={results}/>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <CashFlowChart r={results}/>
              <SavingsBreakdownChart r={results}/>
            </div>
            <ResultsPanel r={results}/>
            <div className="text-[10px] text-gray-400 leading-relaxed pt-2 border-t border-gray-100">
              Calculation logic mirrors <span className="text-frost-300">FES TCO &amp; MLO Modeling.xlsx</span>{" "}
              · Compressor Simulation!C21:J24 (length×cooling) and C65:J80 (length×cooling×weight)
              · Braking scenario: {results.inputs.brakingScenario} (Regeneration Simulation sheet)
              · Payback method: linear interpolation across cumulative-cashflow zero-crossing (matches Years to Parity!V96)
            </div>
          </div>
        </div>
      </section>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
